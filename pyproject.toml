[project]
name = "secure-rag"
version = "0.1.0"
description = "Secure enterprise RAG assistant with role-based access, cited answers, approval-gated agent tools and prompt-injection tests"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anthropic",
  "qdrant-client",
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "pypdf",
  "fastapi>=0.163.2",
  "uvicorn>=0.54.0",
  "langfuse>=5.2.0",
  "psycopg[binary]>=3.3.9",
  "psycopg-pool>=3.3.3",
  "langgraph-checkpoint-postgres>=3.2.1",
]

[project.scripts]
rag = "secure_rag.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
