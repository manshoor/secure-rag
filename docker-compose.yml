# Stack: Postgres (users, access, audit, checkpoints, eval runs),
# Qdrant (persistent vectors) and the API.
#
#   docker compose up -d --build        API at http://127.0.0.1:8010/docs
#
# Credentials here are local values, not secrets. Postgres is published
# on host port 5433 so it does not clash with another local Postgres on 5432.
name: secure-rag

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      QDRANT_URL: http://qdrant:6333
      # Header sign-in: trusts the X-User header, so the API binds to 127.0.0.1 only.
      RAG_AUTH: header
      RAG_LLM: ${RAG_LLM:-offline}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - api-runtime:/app/data/runtime
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  postgres-data:
  qdrant-data:
  api-runtime:
